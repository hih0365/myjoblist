<title>교정 업무 관리</title>

<!--
  =========================================================================
  ⚠️  설정이 반드시 필요합니다 (Google Cloud Console)
  =========================================================================
  1) https://console.cloud.google.com 접속 → 새 프로젝트 생성(또는 기존 프로젝트 선택)
  2) 좌측 메뉴 "API 및 서비스" → "라이브러리" → "Google Drive API" 검색 → 사용 설정
  3) "API 및 서비스" → "OAuth 동의 화면"
       - User Type: 개인 사용이면 "외부(External)" 선택 후 테스트 사용자에 본인 구글 계정 추가
       - 범위(Scopes) 추가 불필요 (아래 CLIENT_ID 발급 후 코드에서 요청)
  4) "API 및 서비스" → "사용자 인증 정보" → "+ 사용자 인증 정보 만들기" → "OAuth 클라이언트 ID"
       - 애플리케이션 유형: 웹 애플리케이션
       - "승인된 자바스크립트 원본"에 이 파일을 실제로 열어볼 주소를 추가
         예) https://내도메인.com  또는  http://localhost:5500  (Live Server 등으로 로컬 테스트 시)
         ※ file:// 로 직접 여는 방식은 동작하지 않습니다. 반드시 http(s) 서버로 열어야 합니다.
  5) 발급된 "클라이언트 ID" 값을 아래 CONFIG.CLIENT_ID 에 붙여넣기
  =========================================================================
-->

<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>
  :root{
    --ink:#1f2937;
    --paper:#f7f6f2;
    --card:#ffffff;
    --line:#dcd8cf;
    --steel:#2c5f7c;
    --steel-dark:#1c4054;

    --amber:#b98a2b;
    --amber-soft:#faf1de;

    --red:#b0413e;

  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:var(--sans); background:var(--paper); color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');

  /* --- ruler / tick-mark motif header --- */

    background:var(--steel-dark); color:#fff; padding:0;
    position:sticky; top:0; z-index:20;
  }
  .header-inner{
    max-width:1100px; margin:0 auto; padding:22px 24px 0 24px;

  label:first-child{ margin-top:0; }
  input[type=text]{
    width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:6px; font-size:13px;

  .upload-zone{

  .upload-zone.drag{ border-color:var(--steel); background:var(--steel-soft); color:var(--steel-dark); }
  .upload-zone input{ display:none; }

  .spin{
    width:14px; height:14px; border:2px solid rgba(255,255,255,0.4); border-top-color:#fff;
    border-radius:50%; display:inline-block; animation:sp .7s linear infinite; vertical-align:-2px;
  }
  @keyframes sp{ to{ transform:rotate(360deg); } }

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);

  @media (max-width:520px){
    .row2{ grid-template-columns:1fr; }

</style>

<script>
/* =========================================================================
   설정
   ========================================================================= */
const CONFIG = {
  CLIENT_ID: '493809666967-1a5cksgaufb38r5uivu5e3snfo1ik6ll.apps.googleusercontent.com', // ⚠️ 여기에 발급받은 클라이언트 ID를 넣으세요
  SCOPES: 'https://www.googleapis.com/auth/drive.file',
  ROOT_FOLDER_NAME: '교정업무관리',
  INPROGRESS_FOLDER_NAME: '진행중',
  DONE_FOLDER_NAME: '완료',
};

let accessToken = null;
let tokenClient = null;
let rootFolderId = null, inProgressFolderId = null, doneFolderId = null;
let currentTab = 'inprogress';
let cachedInProgress = [];   // [{id,name}]
let cachedDoneMonths = {};   // { '2026-07': [{id,name}] }
let activeFolder = null;     // { id, name } currently open in file modal
let searchTerm = '';

/* =========================================================================
   유틸
   ========================================================================= */
function toast(msg, isError){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isError ? ' error' : '');
  clearTimeout(toast._timer);
  toast._timer = setTimeout(()=> t.classList.remove('show'), 3200);
}

function pad2(n){ return String(n).padStart(2,'0'); }

function todayMMDD(){
  const d = new Date();
  return pad2(d.getMonth()+1) + pad2(d.getDate());
}

function thisYearMonth(){
  const d = new Date();
  return d.getFullYear() + '-' + pad2(d.getMonth()+1);
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function buildTicks(){
  const bar = document.getElementById('tickBar');
  bar.innerHTML = '';
  for(let i=0;i<60;i++){ bar.appendChild(document.createElement('span')); }
}
buildTicks();

/* =========================================================================
   Drive API 헬퍼 (fetch 기반, gapi 라이브러리 미사용)
   ========================================================================= */
async function driveFetch(path, options={}){
  if(!accessToken) throw new Error('로그인이 필요합니다.');
  const isFullUrl = path.startsWith('http');
  const url = isFullUrl ? path : `https://www.googleapis.com/drive/v3/${path}`;
  const res = await fetch(url, {
    ...options,
    headers: {
      'Authorization': `Bearer ${accessToken}`,
      ...(options.headers||{})
    }
  });
  if(res.status === 401){
    accessToken = null;
    toast('로그인이 만료되었습니다. 다시 로그인해주세요.', true);
    showSignedOut();
    throw new Error('토큰 만료');
  }
  if(!res.ok){
    const errText = await res.text();
    throw new Error(`Drive API 오류 (${res.status}): ${errText}`);
  }
  if(res.status === 204) return null;
  return res.json();
}

async function findFolder(name, parentId){
  const q = encodeURIComponent(
    `name = '${name.replace(/'/g, "\\'")}' and mimeType = 'application/vnd.google-apps.folder' and trashed = false` +
    (parentId ? ` and '${parentId}' in parents` : '')
  );
  const data = await driveFetch(`files?q=${q}&fields=files(id,name)`);
  return data.files && data.files.length ? data.files[0] : null;
}

async function createFolder(name, parentId){
  const body = {
    name,
    mimeType: 'application/vnd.google-apps.folder',
    parents: parentId ? [parentId] : undefined
  };
  return driveFetch('files?fields=id,name', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify(body)
  });
}

async function findOrCreateFolder(name, parentId){
  const existing = await findFolder(name, parentId);
  if(existing) return existing;
  return createFolder(name, parentId);
}

async function listChildFolders(parentId){
  const q = encodeURIComponent(
    `'${parentId}' in parents and mimeType = 'application/vnd.google-apps.folder' and trashed = false`
  );
  const data = await driveFetch(`files?q=${q}&fields=files(id,name,createdTime)&orderBy=name desc&pageSize=1000`);
  return data.files || [];
}

async function listFilesIn(parentId){
  const q = encodeURIComponent(
    `'${parentId}' in parents and mimeType != 'application/vnd.google-apps.folder' and trashed = false`
  );
  const data = await driveFetch(`files?q=${q}&fields=files(id,name,webViewLink,iconLink,size)&orderBy=name`);
  return data.files || [];
}

async function uploadFileToFolder(folderId, file){
  const metadata = { name: file.name, parents:[folderId] };
  const form = new FormData();
  form.append('metadata', new Blob([JSON.stringify(metadata)], {type:'application/json'}));
  form.append('file', file);
  const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name', {
    method:'POST',
    headers:{ 'Authorization': `Bearer ${accessToken}` },
    body: form
  });
  if(!res.ok){ throw new Error(await res.text()); }
  return res.json();
}

async function deleteFile(fileId){
  await driveFetch(`files/${fileId}`, { method:'DELETE' });
}

async function moveFolder(folderId, fromParent, toParent){
  await driveFetch(`files/${folderId}?addParents=${toParent}&removeParents=${fromParent}&fields=id,parents`, {
    method:'PATCH'
  });
}

/* =========================================================================
   초기 폴더 구조 확보
   ========================================================================= */
async function ensureRootStructure(){
  document.getElementById('rootStatus').textContent = 'Drive 폴더 구조 확인 중…';
  rootFolderId = (await findOrCreateFolder(CONFIG.ROOT_FOLDER_NAME, null)).id;
  inProgressFolderId = (await findOrCreateFolder(CONFIG.INPROGRESS_FOLDER_NAME, rootFolderId)).id;
  doneFolderId = (await findOrCreateFolder(CONFIG.DONE_FOLDER_NAME, rootFolderId)).id;
  document.getElementById('rootStatus').textContent =
    `연결됨 · Drive / ${CONFIG.ROOT_FOLDER_NAME}`;
}

/* =========================================================================
   인증
   ========================================================================= */
function initAuth(){
  if(CONFIG.CLIENT_ID.startsWith('YOUR_CLIENT_ID')){
    toast('CONFIG.CLIENT_ID를 먼저 설정해주세요 (코드 상단 주석 참고).', true);
  }
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CONFIG.CLIENT_ID,
    scope: CONFIG.SCOPES,
    callback: async (resp)=>{
      if(resp.error){ toast('로그인에 실패했습니다: ' + resp.error, true); return; }
      accessToken = resp.access_token;
      await onSignedIn();
    }
  });
}

async function onSignedIn(){
  document.getElementById('signInBtn').style.display = 'none';
  document.getElementById('signOutBtn').style.display = 'inline-block';
  document.getElementById('userChip').style.display = 'inline';
  document.getElementById('userChip').textContent = '연결됨';
  document.getElementById('gate').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('fabAdd').style.display = 'flex';
  try{
    await ensureRootStructure();
    await refreshInProgress();
    await refreshDone();
  }catch(e){
    console.error(e);
    toast('Drive 폴더 구조를 불러오지 못했습니다: ' + e.message, true);
  }
}

function showSignedOut(){
  accessToken = null;
  document.getElementById('signInBtn').style.display = 'inline-block';
  document.getElementById('signOutBtn').style.display = 'none';
  document.getElementById('userChip').style.display = 'none';
  document.getElementById('gate').style.display = 'block';
  document.getElementById('app').style.display = 'none';
  document.getElementById('fabAdd').style.display = 'none';
  document.getElementById('rootStatus').textContent = 'Google Drive 연결 대기 중…';
}

document.getElementById('signInBtn').addEventListener('click', ()=>{
  tokenClient.requestAccessToken({ prompt: accessToken ? '' : 'consent' });
});
document.getElementById('signOutBtn').addEventListener('click', ()=>{
  if(accessToken){
    google.accounts.oauth2.revoke(accessToken, ()=>{});
  }
  showSignedOut();
});

/* =========================================================================
   목록 렌더링 — 진행중
   ========================================================================= */
async function refreshInProgress(){
  cachedInProgress = await listChildFolders(inProgressFolderId);
  renderInProgress();
}

function parseFolderName(name){
  // MMDD-**교정-업체명-비고  형태 파싱 (표시용, 실패해도 원본 표시)
  const parts = name.split('-');
  return {
    date: parts[0] || '',
    rest: parts.slice(1).join('-')
  };
}

function renderInProgress(){
  const el = document.getElementById('viewInProgress');
  const filtered = cachedInProgress.filter(f =>
    !searchTerm || f.name.toLowerCase().includes(searchTerm.toLowerCase())
  );
  if(filtered.length === 0){
    el.innerHTML = `<div class="empty">진행중인 업무 폴더가 없습니다. 우측 하단 + 버튼으로 새 폴더를 만들어보세요.</div>`;
    return;
  }
  el.innerHTML = `<div class="card-grid">` + filtered.map(f=>{
    const p = parseFolderName(f.name);
    return `
      <div class="task-card" data-id="${f.id}">
        <div class="datebar"><span>${escapeHtml(p.date)}</span><span>진행중</span></div>
        <div class="body" data-open="${f.id}" data-name="${escapeHtml(f.name)}">
          <div class="company">${escapeHtml(p.rest || f.name)}</div>
        </div>
        <div class="footer">
          <label class="check-label">
            <input type="checkbox" data-complete="${f.id}" data-fname="${escapeHtml(f.name)}">
            완료
          </label>
          <button class="btn ghost" style="padding:5px 10px;font-size:11px;" data-open="${f.id}" data-name="${escapeHtml(f.name)}">열기</button>
        </div>
      </div>
    `;
  }).join('') + `</div>`;

  el.querySelectorAll('[data-open]').forEach(node=>{
    node.addEventListener('click', ()=> openFolderModal(node.dataset.open, node.dataset.name));
  });
  el.querySelectorAll('[data-complete]').forEach(cb=>{
    cb.addEventListener('change', (e)=> handleComplete(e.target.dataset.complete, e.target.dataset.fname, e.target));
  });
}

async function handleComplete(folderId, folderName, checkboxEl){
  if(!confirm(`"${folderName}" 폴더를 완료 처리하시겠습니까?\n완료 목록의 이번 달 폴더로 이동됩니다.`)){
    checkboxEl.checked = false;
    return;
  }
  checkboxEl.disabled = true;
  try{
    const ym = thisYearMonth();
    const monthFolder = await findOrCreateFolder(ym, doneFolderId);
    await moveFolder(folderId, inProgressFolderId, monthFolder.id);
    toast(`완료 처리했습니다 → 완료 / ${ym}`);
    await refreshInProgress();
    await refreshDone();
  }catch(e){
    console.error(e);
    toast('완료 처리 중 오류: ' + e.message, true);
    checkboxEl.checked = false;
    checkboxEl.disabled = false;
  }
}

/* =========================================================================
   목록 렌더링 — 완료 (월별)
   ========================================================================= */
async function refreshDone(){
  const months = await listChildFolders(doneFolderId); // month folders, e.g. 2026-07
  months.sort((a,b)=> b.name.localeCompare(a.name));
  cachedDoneMonths = {};
  for(const m of months){
    cachedDoneMonths[m.name] = { id:m.id, items: await listChildFolders(m.id) };
  }
  renderDone();
}

function renderDone(){
  const el = document.getElementById('viewDone');
  const monthKeys = Object.keys(cachedDoneMonths);
  if(monthKeys.length === 0){
    el.innerHTML = `<div class="empty">완료된 업무가 아직 없습니다.</div>`;
    return;
  }
  let html = '';
  for(const ym of monthKeys){
    const group = cachedDoneMonths[ym];
    const items = group.items.filter(f => !searchTerm || f.name.toLowerCase().includes(searchTerm.toLowerCase()));
    if(items.length === 0) continue;
    html += `<div class="month-group"><h3>${ym}</h3><div class="card-grid">` + items.map(f=>{
      const p = parseFolderName(f.name);
      return `
        <div class="task-card">
          <div class="datebar"><span>${escapeHtml(p.date)}</span><span>완료</span></div>
          <div class="body" data-open="${f.id}" data-name="${escapeHtml(f.name)}">
            <div class="company">${escapeHtml(p.rest || f.name)}</div>
          </div>
          <div class="footer">
            <button class="btn ghost" style="padding:5px 10px;font-size:11px;" data-restore="${f.id}" data-month="${group.id}">진행중으로 복원</button>
            <button class="btn ghost" style="padding:5px 10px;font-size:11px;" data-open="${f.id}" data-name="${escapeHtml(f.name)}">열기</button>
          </div>
        </div>
      `;
    }).join('') + `</div></div>`;
  }
  el.innerHTML = html || `<div class="empty">검색 결과가 없습니다.</div>`;

  el.querySelectorAll('[data-open]').forEach(node=>{
    node.addEventListener('click', ()=> openFolderModal(node.dataset.open, node.dataset.name));
  });
  el.querySelectorAll('[data-restore]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      if(!confirm('이 업무를 다시 "진행중" 목록으로 되돌릴까요?')) return;
      try{
        await moveFolder(btn.dataset.restore, btn.dataset.month, inProgressFolderId);
        toast('진행중 목록으로 복원했습니다.');
        await refreshInProgress();
        await refreshDone();
      }catch(e){
        toast('복원 중 오류: ' + e.message, true);
      }
    });
  });
}

/* =========================================================================
   탭 / 검색
   ========================================================================= */
document.getElementById('tabInProgress').addEventListener('click', ()=>{
  currentTab = 'inprogress';
  document.getElementById('tabInProgress').classList.add('active');
  document.getElementById('tabDone').classList.remove('active');
  document.getElementById('viewInProgress').style.display = 'block';
  document.getElementById('viewDone').style.display = 'none';
});
document.getElementById('tabDone').addEventListener('click', ()=>{
  currentTab = 'done';
  document.getElementById('tabDone').classList.add('active');
  document.getElementById('tabInProgress').classList.remove('active');
  document.getElementById('viewDone').style.display = 'block';
  document.getElementById('viewInProgress').style.display = 'none';
});
document.getElementById('searchInput').addEventListener('input', (e)=>{
  searchTerm = e.target.value.trim();
  renderInProgress();
  renderDone();
});

/* =========================================================================
   새 폴더 생성 모달
   ========================================================================= */
const newFolderOverlay = document.getElementById('newFolderOverlay');
document.getElementById('fabAdd').addEventListener('click', ()=>{
  document.getElementById('fDate').value = todayMMDD();
  document.getElementById('fCode').value = '';
  document.getElementById('fCompany').value = '';
  document.getElementById('fNote').value = '';
  updatePreview();
  newFolderOverlay.classList.add('show');
});

function updatePreview(){
  const date = document.getElementById('fDate').value.trim() || 'MMDD';
  const code = document.getElementById('fCode').value.trim();
  const company = document.getElementById('fCompany').value.trim() || '업체명';
  const note = document.getElementById('fNote').value.trim();
  let name = `${date}-${code}교정-${company}`;
  if(note) name += `-${note}`;
  document.getElementById('fPreview').textContent = name;
  return name;
}
['fDate','fCode','fCompany','fNote'].forEach(id=>{
  document.getElementById(id).addEventListener('input', updatePreview);
});

document.getElementById('createFolderBtn').addEventListener('click', async ()=>{
  const company = document.getElementById('fCompany').value.trim();
  if(!company){ toast('업체명을 입력해주세요.', true); return; }
  const name = updatePreview();
  const btn = document.getElementById('createFolderBtn');
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span> 생성 중…';
  try{
    await createFolder(name, inProgressFolderId);
    toast('새 업무 폴더를 만들었습니다.');
    newFolderOverlay.classList.remove('show');
    await refreshInProgress();
  }catch(e){
    toast('폴더 생성 중 오류: ' + e.message, true);
  }finally{
    btn.disabled = false; btn.textContent = '폴더 만들기';
  }
});

/* =========================================================================
   폴더(파일) 모달
   ========================================================================= */
const folderOverlay = document.getElementById('folderOverlay');

async function openFolderModal(folderId, folderName){
  activeFolder = { id: folderId, name: folderName };
  document.getElementById('folderModalTitle').textContent = folderName;
  document.getElementById('folderModalMeta').textContent = '첨부파일';
  document.getElementById('fileListEl').innerHTML = `<li>불러오는 중…</li>`;
  folderOverlay.classList.add('show');
  await refreshFileList();
}

async function refreshFileList(){
  if(!activeFolder) return;
  try{
    const files = await listFilesIn(activeFolder.id);
    const el = document.getElementById('fileListEl');
    if(files.length === 0){
      el.innerHTML = `<li style="color:#8f8a7c;">아직 첨부된 파일이 없습니다.</li>`;
      return;
    }
    el.innerHTML = files.map(f=>`
      <li data-fid="${f.id}">
        <span class="fname">
          <img src="${f.iconLink||''}" width="16" height="16" alt="">
          <a href="${f.webViewLink}" target="_blank" rel="noopener">${escapeHtml(f.name)}</a>
        </span>
        <button class="del" data-delid="${f.id}" data-delname="${escapeHtml(f.name)}">삭제</button>
      </li>
    `).join('');
    el.querySelectorAll('[data-delid]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        if(!confirm(`"${btn.dataset.delname}" 파일을 삭제할까요?`)) return;
        try{
          await deleteFile(btn.dataset.delid);
          toast('파일을 삭제했습니다.');
          await refreshFileList();
        }catch(e){
          toast('삭제 중 오류: ' + e.message, true);
        }
      });
    });
  }catch(e){
    document.getElementById('fileListEl').innerHTML = `<li style="color:#b0413e;">목록을 불러오지 못했습니다.</li>`;
  }
}

const uploadZone = document.getElementById('uploadZone');
const fileInput = document.getElementById('fileInput');
uploadZone.addEventListener('click', ()=> fileInput.click());
uploadZone.addEventListener('dragover', (e)=>{ e.preventDefault(); uploadZone.classList.add('drag'); });
uploadZone.addEventListener('dragleave', ()=> uploadZone.classList.remove('drag'));
uploadZone.addEventListener('drop', (e)=>{
  e.preventDefault(); uploadZone.classList.remove('drag');
  handleUploadFiles(e.dataTransfer.files);
});
fileInput.addEventListener('change', ()=> handleUploadFiles(fileInput.files));

async function handleUploadFiles(fileList){
  if(!activeFolder || !fileList || fileList.length === 0) return;
  uploadZone.textContent = '업로드 중…';
  try{
    for(const file of fileList){
      await uploadFileToFolder(activeFolder.id, file);
    }
    toast(`${fileList.length}개 파일을 업로드했습니다.`);
    await refreshFileList();
  }catch(e){
    toast('업로드 중 오류: ' + e.message, true);
  }finally{
    uploadZone.textContent = '파일을 드래그하거나 클릭하여 업로드';
    fileInput.value = '';
  }
}

/* =========================================================================
   모달 닫기 공통
   ========================================================================= */
document.querySelectorAll('[data-close]').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    newFolderOverlay.classList.remove('show');
    folderOverlay.classList.remove('show');
    activeFolder = null;
  });
});
document.querySelectorAll('.overlay').forEach(ov=>{
  ov.addEventListener('click', (e)=>{
    if(e.target === ov){
      ov.classList.remove('show');
      activeFolder = null;
    }
  });
});

/* =========================================================================
   초기화
   ========================================================================= */
window.addEventListener('load', ()=>{
  // GIS 스크립트 로드를 약간 기다린 뒤 초기화
  const wait = setInterval(()=>{
    if(window.google && google.accounts && google.accounts.oauth2){
      clearInterval(wait);
      initAuth();
    }
  }, 100);
});
</script>
